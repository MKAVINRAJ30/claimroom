class: Item
table: item
fields:
  roomId: int
  name: String
  price: double
  quantity: int
  status: String
  paid: bool, default=false
  imageUrl: String?
  heldBy: String?
  heldByContact: String?
  holdExpiresAt: DateTime?
  soldTo: String?
  soldToContact: String?
  soldAt: DateTime?
indexes:
  item_room_idx:
    fields: roomId